
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Dashboard de Alunos</h1>
        </header>

        <aside>
            <h2>Menu</h2>
            <p>Início</p>
            <p>Alunos</p>
            <p>Notas</p>
        </aside>

        <main>
            <h2>Resumo</h2>

            <div class="cards">
                <div class="card">
                    <h3>Alunos</h3>
                    <p>120</p>
                </div>

                <div class="card">
                    <h3>Turmas</h3>
                    <p>5</p>
                </div>

                <div class="card">
                    <h3>Disciplinas</h3>
                    <p>8</p>
                </div>
            </div>

            <h2>Lista de Alunos</h2>

            <table>
                <tr>
                    <th>Nome</th>
                    <th>Curso</th>
                    <th>Nota</th>
                </tr>
                <tr>
                    <td>Ana</td>
                    <td>Informática</td>
                    <td>16</td>
                </tr>
                <tr>
                    <td>Pedro</td>
                    <td>Informática</td>
                    <td>14</td>
                </tr>
                <tr>
                    <td>Maria</td>
                    <td>Informática</td>
                    <td>18</td>
                </tr>
            </table>
        </main>

        <footer>
            <p>Dashboard - Programação Web</p>
        </footer>

    </div>

</body>
</html>
