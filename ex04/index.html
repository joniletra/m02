
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componentes CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Componentes CSS</h1>

    <h2>Cards</h2>

    <div class="card">
        <h3>Cartão 1</h3>
        <p>Exemplo de um cartão.</p>
    </div>

    <div class="card">
        <h3>Cartão 2</h3>
        <p>Outro cartão com o mesmo estilo.</p>
    </div>

    <h2>Buttons</h2>

    <button class="botao">Botão 1</button>
    <button class="botao">Botão 2</button>

    <h2>Alerts</h2>

    <div class="alerta">
        Esta é uma mensagem de alerta!
    </div>

    <h2>Badges</h2>

    <span class="badge">Novo</span>
    <span class="badge">Ativo</span>

    <h2>Forms</h2>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <button class="botao" type="submit">Enviar</button>
    </form>

</body>
</html>
