
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">MeuSite</div>

        <div class="links">
            <a href="#inicio">Início</a>
            <a href="#sobre">Sobre</a>
            <a href="#contactos">Contactos</a>
        </div>

        <button type="button">Entrar</button>
    </nav>

    <main>
        <section id="inicio">
            <h1>Bem-vindo ao MeuSite</h1>
            <p>Exemplo de uma barra de navegação responsiva.</p>
        </section>

        <section id="sobre">
            <h2>Sobre</h2>
            <p>Este site demonstra o uso de Flexbox.</p>
        </section>

        <section id="contactos">
            <h2>Contactos</h2>
            <p>Secção de contactos.</p>
        </section>
    </main>

</body>
</html>
