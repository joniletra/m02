
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Flexbox Playground</h1>

    <h2>1. Flex Direction - Row</h2>
    <div class="container linha">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <h2>2. Flex Direction - Column</h2>
    <div class="container coluna">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <h2>3. Justify Content - Center</h2>
    <div class="container centro">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <h2>4. Align Items - Center</h2>
    <div class="container alinhar">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <h2>5. Flex Wrap, Grow e Shrink</h2>
    <div class="container flexivel">
        <div class="item crescer">1</div>
        <div class="item diminuir">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>

</body>
</html>
